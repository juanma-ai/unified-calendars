services:
  family-calendar:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:8290:3000"
    environment:
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      WEB_ALLOWED_SUBJECTS: ${WEB_ALLOWED_SUBJECTS}
      RADICALE_URL: ${RADICALE_URL}
      RADICALE_USER: ${RADICALE_USER}
      RADICALE_PASSWORD: ${RADICALE_PASSWORD}
      RADICALE_CALENDAR_PATH: /familia/casa/
      VIKUNJA_BASE_URL: ${VIKUNJA_BASE_URL}
      VIKUNJA_TOKEN: ${VIKUNJA_TOKEN}
      VIKUNJA_PROJECT_IDS: ${VIKUNJA_PROJECT_IDS}
    networks:
      - family-calendar
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
networks:
  family-calendar:
    external: true
    name: family-calendar-backend
